<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A120F">
<title>TrafgFood</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,600;0,700;1,800;1,900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: DeliveFood shell. Dark green sidebar on desktop, drawer + bottom tabs on phone; content column widens beside the sidebar. Single dark theme by choice, matching the DeliveFood Relatórios system. */
:root{
  --bg:#0A120F; --side:#0D1814; --surface:#12201B; --sunk:#192A24; --line:#21342D;
  --fg:#E6EFEA; --muted:#8DA198; --accent:#1DB46A; --accent-fg:#04110A; --accent-soft:#143524;
  --meta:#93A5FF; --meta-soft:#1D2548; --google:#F2B04A; --google-soft:#382A11;
  --good:#4ADE80; --good-soft:#123522; --warn:#F2B04A; --warn-soft:#382A11; --bad:#FF8A80; --bad-soft:#3B1C1B;
  --shadow:0 10px 30px rgba(0,0,0,.55);
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.brand{font-weight:700;font-size:19px;letter-spacing:-.01em;line-height:1.1;min-width:0}
.brand small{display:block;font:500 11px/1.4 var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.top .sp{flex:1}
.mock{border:1px solid var(--warn-soft);font:600 11px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:6px 10px;white-space:nowrap}

.filters{display:flex;gap:8px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

h2{font-family:var(--f-display);font-weight:600;font-size:17px;margin:22px 0 10px;text-wrap:balance}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi[data-help]{cursor:pointer}
.kpi .v{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:21px;font-weight:500;margin-top:2px}
.kpi .d{font-size:12px;margin-top:2px}
.up{color:var(--good)} .down{color:var(--bad)}

.chartcard{background:var(--surface);border-radius:14px;padding:14px;margin-top:10px}
.chartcard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--muted)}
.legend{display:flex;gap:12px;font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--muted);font:11px var(--f-data)}
.chartcard svg{display:block;max-height:230px;margin-inline:auto}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:12px;padding:11px 12px;border-left:4px solid var(--warn)}
.alert.bad{border-left-color:var(--bad)} .alert.good{border-left-color:var(--good)}
.alert p{margin:0;font-size:14px;min-width:0}
.alert button{margin-left:auto;flex:none}

.list{display:flex;flex-direction:column;gap:8px}
.camp{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--surface);border:0;border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.camp .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.camp .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.camp .stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.camp .stats div{min-width:0}
.camp .stats span{display:block;font-size:11px;color:var(--muted)}
.camp .stats b{font:500 14px var(--f-data);font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;letter-spacing:.02em}
.tag.meta{background:var(--meta-soft);color:var(--meta)} .tag.google{background:var(--google-soft);color:var(--google)}
.st{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap;align-self:start}
.st.ativa{background:var(--good-soft);color:var(--good)} .st.pausada{background:var(--sunk);color:var(--muted)} .st.analise{background:var(--warn-soft);color:var(--warn)}

.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--sunk);color:var(--fg)}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.dng{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}

.clients{display:grid;grid-template-columns:1fr;gap:8px}
.client{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:12px 14px}
.av{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font:700 15px var(--f-display);color:#fff}
.client .info{min-width:0;flex:1}
.client .info b{display:block}
.client .info span{font-size:12px;color:var(--muted)}
.client .r{text-align:right;font-size:12px;color:var(--muted)}
.client .r b{display:block;font:500 15px var(--f-data);color:var(--fg)}

.conn{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.conn ol{margin:4px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.conn .h{display:flex;align-items:center;gap:8px;font-weight:600}

/* copilot */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:140px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:var(--surface);border-bottom-left-radius:5px}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:13px;text-align:center}
.suggest{display:flex;flex-wrap:wrap;gap:6px}
.composer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--bg);border-top:1px solid var(--line)}
.composer .in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;max-height:120px}
.icbtn{flex:none;width:44px;height:44px;border-radius:13px;border:0;display:grid;place-items:center;background:var(--sunk);color:var(--fg)}
.icbtn.pri{background:var(--accent);color:var(--accent-fg)}
.icbtn.on{background:var(--bad);color:#fff}
.icbtn svg{width:20px;height:20px}
.voicebar{max-width:560px;margin:0 auto;padding:0 16px 6px;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.voicebar label{display:flex;gap:6px;align-items:center}

.cores{display:flex;flex-wrap:wrap;gap:10px}
.cor{width:30px;height:30px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.cor[aria-pressed="true"]{border-color:var(--bg);box-shadow:0 0 0 2px var(--fg)}
.btn.danger{color:#E8505B;border-color:#E8505B55}
/* saúde, tabelas, primeiros passos */
.hb{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--f-body);border-radius:999px;padding:4px 8px;white-space:nowrap;vertical-align:1px}
.hb::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.hb.bom{background:var(--good-soft);color:var(--good)} .hb.limite{background:var(--warn-soft);color:var(--warn)} .hb.ruim{background:var(--bad-soft);color:var(--bad)}
.hb.semdado,.hb.semmargem{background:var(--sunk);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.setup{margin-bottom:12px}
.setup .hd{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.setup .hd span{color:var(--muted);font-size:12px}
.bar{height:6px;background:var(--sunk);border-radius:99px;margin:10px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.setup ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.setup li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.setup li:first-child{border-top:0}
.setup li>div{flex:1;min-width:0}
.setup li small{display:block;color:var(--muted);font-size:12px}
.setup li.ok b{color:var(--muted);font-weight:500;text-decoration:line-through}
.ck{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--accent-fg)}
.setup li.ok .ck{background:var(--accent);border-color:var(--accent)}
.alert .ico{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-data);background:var(--warn-soft);color:var(--warn)}
.alert.bad .ico{background:var(--bad-soft);color:var(--bad)} .alert.good .ico{background:var(--good-soft);color:var(--good)}
.alert p{flex:1}
h2 .count{font:600 12px var(--f-data);background:var(--sunk);color:var(--muted);border-radius:99px;padding:2px 8px;vertical-align:2px}
.duo{display:flex;flex-direction:column}
.duo .chartcard{display:flex;flex-direction:column}.duo .chartcard svg{margin-block:auto}
.kpi .v.up{color:var(--good)} .kpi .v.down{color:var(--bad)}
.k5 .kpi:last-child{grid-column:1/-1}
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.tbl th{text-align:left;font:600 11px/1.2 var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{all:unset;cursor:pointer}.tbl th button:focus-visible{outline:2px solid var(--accent)}
.tbl th.n,.tbl td.n{text-align:right}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n{font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td small{display:block;font:400 11px var(--f-body);color:var(--muted);margin-top:2px}
.tbl td.up{color:var(--good)} .tbl td.down{color:var(--bad)}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:var(--sunk)}.tbl tbody tr:last-child td{border-bottom:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;vertical-align:0}
.metas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metas div{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.metas span{font-size:12px;color:var(--muted)} .metas b{font:500 19px var(--f-data)} .metas .hb{align-self:flex-start}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar input{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 12px}
.toolbar .row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chip .num{opacity:.7;margin-left:3px;font-size:12px}
.desk{display:none}
.cfgs{display:grid;gap:12px}
.oauth{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:13px;color:var(--muted)}.oauth b{color:var(--fg);font-size:14px}
.cfg{display:flex;flex-direction:column;gap:10px}
.cfh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.cfh b{font-family:var(--f-display);font-size:16px}
.stx{font:600 12px/1 var(--f-body);border-radius:999px;padding:5px 10px;background:var(--sunk);color:var(--muted)}
.stx.ok{background:var(--good-soft);color:var(--good)}.stx.bad{background:var(--bad-soft);color:var(--bad)}.stx.warn{background:var(--warn-soft);color:var(--warn)}
.tmsg{margin:0;font-size:13px;border-radius:10px;padding:8px 10px;background:var(--sunk)}.tmsg.ok{color:var(--good)}.tmsg.bad{color:var(--bad)}
.cfin{display:flex;gap:8px}.cfin input{flex:1;min-width:0;font-family:var(--f-data);font-size:14px}
.pill.off{background:var(--sunk);color:var(--muted)}.pill.off i{background:var(--muted)}
.setup-min{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;margin-bottom:12px;color:var(--muted);font-size:13px}
.client .r b.up{color:var(--good)} .client .r b.down{color:var(--bad)}
@media (max-width:899px){.hora{display:none}}
@media (min-width:900px){.setup ol{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}.setup li:nth-child(2){border-top:0}}
.client .info b .hb{margin-left:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.sheet h3{font-family:var(--f-display);font-size:19px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.sheet .sub{margin-top:-6px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:10px 12px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px}
.money b{font-family:var(--f-data)}
.diff{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.diff dt{color:var(--muted)} .diff dd{margin:0;font-family:var(--f-data);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

/* DeliveFood shell */
.side{position:fixed;top:0;bottom:0;left:0;width:264px;z-index:40;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));overflow-y:auto;transform:translateX(-100%);transition:transform .2s ease}
.side.open{transform:none;box-shadow:var(--shadow)}
.drawerScrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px 14px}
.logo img{width:48px;height:43px;flex:none}
.logo b{display:block;font:italic 900 23px/1 var(--f-display);letter-spacing:-.02em;color:var(--fg)}
.logo b span{color:var(--accent)}
.logo small{display:block;font:600 10px/1.6 var(--f-body);letter-spacing:.28em;color:var(--muted);margin-top:3px}
.grp{font:600 11px/1 var(--f-body);letter-spacing:.08em;color:var(--muted);padding:14px 10px 6px;text-transform:uppercase}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--accent)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--fg);text-align:left;padding:8px 10px;border-radius:9px;font-size:14px;opacity:.88}
.snav button:hover{background:var(--sunk);opacity:1}
.snav button svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.snav button[aria-current="page"]{background:var(--accent-soft);opacity:1;font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.snav button[aria-current="page"] svg{stroke:var(--accent)}
.side .sp{flex:1;min-height:12px}
.ucard{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.ucard .av{width:32px;height:32px;font-size:12px;border-radius:50%}
.ucard b{display:block;font-size:14px}.ucard small{color:var(--muted);font-size:12px}
.ucard.ia{gap:8px}.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 10px;font-weight:600;font-size:13px}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.side .foot{font-size:11px;color:var(--muted);padding:6px 4px 0}
.icbtn.menu{background:var(--surface)}
.brand{font-family:var(--f-display)}
@media (min-width:900px){
  .side{transform:none}
  .drawerScrim,.icbtn.menu,nav.tabs{display:none!important}
  .app{max-width:none;margin:0 0 0 264px;padding-inline:32px;padding-block:0 40px}
  .app>*{max-width:1240px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpis.k5{grid-template-columns:repeat(5,1fr)} .k5 .kpi:last-child{grid-column:auto}
  .desk{display:block} .mob{display:none!important}
  .metas{grid-template-columns:repeat(4,1fr)}
  .cfgs{grid-template-columns:1fr 1fr;align-items:start}
  .list{display:grid;grid-template-columns:1fr 1fr}
  .clients{grid-template-columns:1fr 1fr}
  .composer{left:264px;bottom:0}
  .chat{padding-bottom:120px}
  .scrim{left:264px}
  .toast{bottom:40px;left:calc(50% + 132px)}
}
@media (min-width:1240px){.duo{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:10px}.duo .chartcard{margin-top:0}.duo h2.first{margin-top:4px}}
@media (max-width:480px){.brand{font-size:17px}.mock{font-size:10px;padding:5px 8px}.top .icbtn{width:40px;height:40px}}
</style>
</head>
<body>


<aside class="side" id="side" aria-label="Menu">
  <div class="logo">
    <img src="/icons/logo.png" alt="" width="48" height="43">
    <div><b>Trafg<span>Food</span></b><small>TRÁFEGO PAGO</small></div>
  </div>
  <div class="grp"><span class="live"><i></i>Meta + Google</span></div>
  <nav class="snav" id="snav">
